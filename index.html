<script>/** A tiny event bus keeps all application rules out of rendering code. */
class EventBus{constructor(){this.listeners=new Set()}on(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn)}emit(event){this.listeners.forEach(fn=>fn(event))}}
/** Seeded randomness makes a case reproducible without a network or a backend. */
class FaultInjector{
 constructor(seed){this.seed=seed>>>0;this.value=this.seed||1}
 random(){let t=this.value+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
 shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 create(rig,difficulty,focus='all',practice=null){
  if(practice){const f=FAULTS.find(x=>x.id===practice);if(!f)throw Error('Unknown fault');return[{...f,resolved:false,discovered:false,introduced:false}]}
  const eligible=FAULTS.filter(f=>rig==='laptop'||f.c!=='laptop');
  const primary=this.shuffle(eligible.filter(f=>focus==='all'||f.c===focus));const remainder=this.shuffle(eligible.filter(f=>!primary.includes(f)));
  const picked=[];const n=DIFFICULTIES[difficulty].n;
  // Prefer different assemblies in general cases; focused cases can combine faults.
  for(const f of [...primary,...remainder]){if(picked.length>=n)break;if(focus==='all'&&picked.some(p=>p.c===f.c))continue;picked.push(f)}
  for(const f of this.shuffle(eligible)){if(picked.length>=n)break;if(!picked.includes(f))picked.push(f)}
  return picked.map(f=>({...f,resolved:false,discovered:false,introduced:false}));
 }
}

class LabAudio{
 constructor(){this.ctx=null;this.fan=null;this.gain=null}
 enable(){try{this.ctx??=new(window.AudioContext||window.webkitAudioContext)();this.ctx.resume().catch(()=>{});if(!this.fan){this.fan=this.ctx.createOscillator();this.fan.type='triangle';this.fan.frequency.value=62;this.gain=this.ctx.createGain();this.gain.gain.value=0;this.fan.connect(this.gain);this.gain.connect(this.ctx.destination);this.fan.start()}}catch{}}
 update(on){if(this.gain)this.gain.gain.setTargetAtTime(on?.006:0,this.ctx.currentTime,.3)}
 beep(pattern=[.10]){if(!view.sound||!this.ctx)return;let at=this.ctx.currentTime;for(const d of pattern){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=650;o.connect(g);g.connect(this.ctx.destination);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.045,at+.01);g.gain.setValueAtTime(.045,at+d-.02);g.gain.linearRampToValueAtTime(0,at+d);o.start(at);o.stop(at+d+.02);at+=d+.13}}
}

 if(m.type==='bios'){title='CoreFix UEFI';const fields=[['boot','bootPriority',[['nvme','OS Boot Manager / NVMe'],['usb','USB / Empty media']]],['mode','bootMode',[['uefi','UEFI / GPT'],['legacy','Legacy / CSM']]],['memory','memoryProfile',[['jedec','JEDEC / 3200 MT/s'],['xmp','XMP / 4000 MT/s']]],['voltage','cpuVoltage',[['auto','Auto / vendor baseline'],['high','Manual / 1.48 V']]],['sata','storageMode',[['ahci','AHCI'],['raid','RAID']]]];body=`<p class="modal-intro">${t('biosIntro')}</p><div class="bios-grid">${fields.map(([key,label,options])=>`<div class="field"><label for="bios-${key}">${t(label)}</label><select id="bios-${key}">${options.map(([value,label])=>`<option value="${value}" ${engine.config[key]===value?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}<div class="field"><label>Secure Boot</label><div class="notice" style="margin:0">${l('مفعّل. عند فشل التوقيع، استعد محملًا موثوقًا من أدوات النظام.|Enabled. For a signature failure, restore a trusted loader from system tools.')}</div></div></div><p class="notes-box">${t('firmwareHint')}</p><div class="modal-actions">${btn('close',t('cancel'))}${btn('saveBios',t('saveReboot'),'primary')}</div>`}

 if(m.type==='about'){title=l('مختبر CoreFix|The CoreFix laboratory');body=`<p class="modal-intro">${l('منظومة صيانة تفاعلية بالعربية والإنجليزية، من BELMO LABS. تعمل دون اتصال وبلا حساب. جميع القراءات والأنظمة والقطع محاكاة تعليمية.|An Arabic and English repair simulation by BELMO LABS. Works offline without an account. All sensors, operating systems and hardware are simulated.')}</p><div class="result-metrics"><div><strong>${FAULTS.length}</strong><span>${t('faults')}</span></div><div><strong>10</strong><span>${l('أقسام|Categories')}</span></div><div><strong>3</strong><span>${l('أنواع أجهزة|Device profiles')}</span></div><div><strong>2</strong><span>${l('لغات|Languages')}</span></div></div><div class="rca-section"><h3>${l('حدود هذه النسخة|Scope of this version')}</h3><p>${l('مخطط ثنائي الأبعاد، محرك أعطال قائم على قواعد، وسيناريوهات مولدة من مكتبة محددة. يمكن أن تتكرر مجموعات أعطال رغم اختلاف رقم الحالة. ليست محاكاة كهربائية على مستوى الترانزستور، ولا تمثل كل أعطال العالم أو اعتمادًا رسميًا. لا يوجد ذكاء اصطناعي متصل أو لعب جماعي في هذه النسخة.|A 2D schematic, a rule-based fault engine and cases generated from a finite library. Fault combinations can repeat even with distinct case IDs. This is not a transistor-level electrical solver, an exhaustive fault database or an official certification. This version has no connected AI or multiplayer.')}</p></div><div class="rca-section"><h3>${l('كيف يعمل المختبر|How the lab works')}</h3><p>${l('FaultInjector يولّد الحالة؛ RepairEngine يحسب الإقلاع والحرارة والنتائج؛ واجهة الأدوات ترسل إجراءات للمحرك نفسه. التبديل بين اللغتين لا يعيد الحالة. الحفظ والتقارير محلية، ومسح بيانات المتصفح يمحو التقدم.|FaultInjector creates a case; RepairEngine computes boot, thermal and scoring state; tools call the same engine. Language changes preserve the case. Progress and reports are local; clearing browser data removes them.')}</p></div><p class="notes-box">${t('thermalNote')} ${t('codeNote')}</p><h3 style="margin-top:20px">${t('refs')}</h3><div class="source-links">${REFERENCES.map(r=>`<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.name} ↗</a>`).join('')}</div>`}
 $('modal-title').textContent=title;$('modal-body').innerHTML=body;if(m.type==='library')renderLibrary();
}
function rcaSection(key,text){return`<section class="rca-section"><h3>${t(key)}</h3><p>${esc(l(text))}</p></section>`}
function referencesFor(c){if(c==='cpu')return[REFERENCES[1],REFERENCES[0]];if(c==='power')return[REFERENCES[2]];if(['ram','gpu','storage','firmware','board'].includes(c))return[REFERENCES[0]];return REFERENCES.slice(0,1)}
function circuit(f){const power=f.c==='power'||f.c==='board'||f.id==='voltage';const heat=f.effect.startsWith('heat');const labels=heat?['CPU / GPU','THERMAL INTERFACE','HEATSINK / AIR']:power?['POWER SOURCE','CONTACT / VRM','LOAD']:['DEVICE','LINK / FIRMWARE','OS / OUTPUT'];const colors=['#75d8d0','#ffc36e','#d0fb68'];const svg=`<svg class="circuit" viewBox="0 0 700 100" role="img" aria-label="${esc(l('مخطط وظيفي مبسط لمسار العطل|Simplified functional fault-path diagram'))}"><defs><marker id="arrow-circuit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#799589"/></marker></defs>${labels.map((label,i)=>`<rect x="${20+i*237}" y="25" width="184" height="48" rx="5" fill="#17251f" stroke="${colors[i]}"/><text x="${112+i*237}" y="54" text-anchor="middle" font-size="13" fill="${colors[i]}" font-family="monospace">${label}</text>${i<2?`<path d="M${205+i*237} 49h40" stroke="#799589" stroke-width="2" marker-end="url(#arrow-circuit)"/>`:''}`).join('')}</svg>`;const formula=heat?'Tjunction ≈ Tambient + P × Rθ (simplified)':power?'ΔV = I × R   ·   Pheat = I² × R':'Device → firmware enumeration → driver → application';return svg+`<div class="formula">${formula}</div>`}
function repairExplanation(f){const strings={paste:'فك المشتت، نظف المعجون، ضع طبقة جديدة، ثم ثبّت المشتت. اترك الحرارة تنخفض قبل التحقق.|Remove cooler, clean compound, apply fresh compound, then mount the cooler. Let temperatures fall before verification.',ramSeat:'اعزل الطاقة، فعّل ESD، فك وحدة الذاكرة ثم أعد تركيبها.|Isolate power, enable ESD, remove the module and reinstall it.',ramClean:'اعزل الطاقة وفك الذاكرة، نظف المنفذ ثم أعد تركيب الوحدة.|Isolate power, remove memory, clean the slot, then reinstall the module.',gpuClean:'اعزل الطاقة وفك البطاقة، نظف المنفذ ثم أعد تركيب البطاقة.|Isolate power, remove the GPU, clean the slot, then reinstall the card.',gpuSeat:'اعزل الطاقة وفك البطاقة، ثم أعد تثبيتها.|Isolate power, remove the card, then reinstall it.',flash:'أصلح أعطال الطاقة أولًا. أطفئ الجهاز مع بقاء التغذية متصلة، ثم شغّل استرداد Firmware الافتراضي.|Repair power faults first. Turn the PC off with the supply connected, then run simulated firmware recovery.',defaults:'يمكن تحميل الافتراضيات بعد POST، أو بعد عزل الطاقة كمسح CMOS افتراضي.|Defaults can be loaded after POST, or with power isolated as a simulated CMOS clear.'};if(strings[f.repair])return`<p class="notice">${l(strings[f.repair])}</p>`;if(ACTIONS[f.repair].backup)return`<p class="notice">${l('شغّل الجهاز حتى يكتمل POST، أنشئ النسخة من أدوات التخزين أو النظام، ثم نفّذ الإصلاح مع مراعاة حالة الطاقة.|Reach POST, create a backup from storage or system tools, then perform the repair with the required power state.')}</p>`;return''}
function renderLibrary(){const q=view.libraryQuery.trim().toLowerCase();const matches=FAULTS.filter(f=>(view.libraryCategory==='all'||f.c===view.libraryCategory)&&(!q||[f.title,f.symptom,f.code,f.evidence].join(' ').toLowerCase().includes(q)));$('library-grid').innerHTML=matches.length?matches.map(f=>`<button class="fault-card" data-rca="${f.id}"><div class="fault-head"><span>${esc(l(CATEGORIES[f.c]))}</span><span>${f.code}</span></div><h3>${esc(l(f.title))}</h3><p>${esc(l(f.symptom))}</p><span class="card-foot">${t('learn')} ↗</span></button>`).join(''):`<p class="modal-intro">${t('noResults')}</p>`;}
function startCase(options){closeModal();engine.reset(options);view.selected=options.practice?FAULTS.find(f=>f.id===options.practice).c:'cpu';view.tool='inspect';view.tab='sensors';renderAll(true);audioFX.beep([.08]);}
function openBios(){if(!engine.postPassed){toast(TEXT.firmwareHint,'warn');return}modal('bios')}
function exportReport(){const r=view.modal?.report||engine.report();const lines=['CoreFix / BELMO LABS',t('report'),'#'+r.seed.toString(16).toUpperCase(),`${t('grade')}: ${r.grade}/100`,`${t('time')}: ${timeStr(r.elapsed)}`,`${t('score')}: ${r.points}`,`${t('mistakes')}: ${r.mistakes}`,`${t('hints')}: ${r.hints}`,'',...r.faults.map(f=>`${l(f.title)} — ${t(f.resolved?'fixed':'unresolved')}`),'',t('reportNote')];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CoreFix_Report_${r.seed}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const handlers={
 bench:()=>{if($('modal').open)closeModal();window.scrollTo({top:0,behavior:'smooth'})},library:()=>modal('library'),history:()=>modal('history'),new:()=>{view.difficulty=engine.difficulty;modal('new')},close:closeModal,about:()=>modal('about'),specs:()=>modal('specs'),
 language:()=>{lang=lang==='ar'?'en':'ar';engine.write('corefix-lang',lang);renderAll(true);renderModal()},sound:()=>{view.sound=!view.sound;if(view.sound){audioFX.enable();audioFX.beep([.10])}audioFX.update(view.sound&&engine.energized);renderAll()},
 power:()=>{engine.power();if(engine.powered)audioFX.beep(engine.effect('memory')?[.13,.13,.13]:engine.effect('video')?[.4,.12,.12]:[.1])},isolate:()=>engine.isolate(),esd:()=>engine.toggleESD(),diagnose:()=>{engine.diagnose(view.selected,view.tool);audioFX.beep([.04])},remove:()=>engine.remove(view.selected),cleanPaste:()=>engine.cleanPaste(),backup:()=>engine.backup(),bios:openBios,
 load:()=>{if(!engine.postPassed){toast('أكمل POST قبل تشغيل الحمل.|Complete POST before applying a load.','warn');return}if(engine.completed)return;engine.load=!engine.load;engine.verifying=0;engine.note(engine.load?'الحمل التجريبي يعمل؛ راقب الحرارة والجهد.|Test load active; monitor temperature and voltage.':'توقف الحمل التجريبي.|Test load stopped.')},
 guide:()=>modal('guide'),hint:()=>{const h=engine.hint();$('hint-result').innerHTML=`<p class="notice">${h?l('افحص |Inspect ')+esc(l(COMPONENTS[h.component].name))+' · '+esc(l(TOOLS[h.tool].label)):l('أعد التجميع وشغّل اختبار الثبات.|Reassemble and run the stability test.')}</p>`},verify:()=>engine.verify(),export:exportReport,
 startCase:()=>{const rig=$('case-rig').value,focus=$('case-focus').value;startCase({rig:focus==='laptop'?'laptop':rig,focus,difficulty:view.difficulty})},saveBios:()=>{const values={};for(const k of ['boot','mode','memory','voltage','sata'])values[k]=$('bios-'+k).value;engine.configure(values);closeModal()}
};
/** One delegated listener covers pointer and keyboard activation of native controls. */
document.addEventListener('click',event=>{const el=event.target.closest('button,[data-component]');if(!el||el.disabled)return;if(el.dataset.action){handlers[el.dataset.action]?.();return}if(el.dataset.component){view.selected=el.dataset.component;renderDetail();updateBoard();engine.diagnose(view.selected,view.tool);return}if(el.dataset.tool){view.tool=el.dataset.tool;renderTools();renderDetail();updateBoard();return}if(el.dataset.tab){view.tab=el.dataset.tab;renderHUD();return}if(el.dataset.repair){engine.repair(el.dataset.repair);audioFX.beep([.035]);return}if(el.dataset.rca){modal('rca',{id:el.dataset.rca});return}if(el.dataset.practice){const f=FAULTS.find(f=>f.id===el.dataset.practice);startCase({rig:f.c==='laptop'?'laptop':'desktop',difficulty:'apprentice',practice:f.id});return}if(el.dataset.difficulty){view.difficulty=el.dataset.difficulty;document.querySelectorAll('[data-difficulty]').forEach(e=>{e.classList.toggle('active',e.dataset.difficulty===view.difficulty);e.setAttribute('aria-pressed',String(e.dataset.difficulty===view.difficulty))});return}if(el.dataset.command){engine.command(el.dataset.command);return}if(el.dataset.report!==undefined){modal('report',{report:engine.history[Number(el.dataset.report)]});return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('#board .part')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('submit',event=>{if(event.target.id==='terminal-form'){event.preventDefault();const input=$('terminal-input');const command=input.value;if(command.trim()){engine.command(command);$('terminal-input')?.focus()}}});
document.addEventListener('input',event=>{if(event.target.id==='library-search'){view.libraryQuery=event.target.value;renderLibrary()}});
document.addEventListener('change',event=>{if(event.target.id==='library-category'){view.libraryCategory=event.target.value;renderLibrary()}});
$('modal').addEventListener('close',()=>{view.modal=null});
engine.bus.on(event=>{if(event.type==='tick'){updateLive();return}if(event.type==='notice'){toast(event.message,event.level);return}if(event.type==='report'){modal('report');return}if(event.type==='verificationFailed'){modal('verification',{checks:event.checks});return}renderAll(event.type==='new');if(event.type==='repair'){const el=document.querySelector(`#board [data-component="${engine.lastRepair}"]`);el?.classList.add('pulse');setTimeout(()=>el?.classList.remove('pulse'),2200)}});
renderAll(true);
let previous=performance.now();setInterval(()=>{const now=performance.now(),dt=(now-previous)/1000;previous=now;if(!document.hidden)engine.tick(dt)},500);
window.addEventListener('beforeunload',()=>engine.save());window.addEventListener('resize',drawHeat);document.addEventListener('visibilitychange',()=>{previous=performance.now();audioFX.update(!document.hidden&&view.sound&&engine.energized)});
/** Optional WebMCP support. Unsupported browsers continue with the complete normal UI. */
const modelContext=document.modelContext;
if(modelContext?.registerTool){const lifecycle=new AbortController();const register=tool=>{try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}};
 register({name:'read_repair_bench',title:'Read the repair bench',description:'Read visible status, sensors and collected evidence. Does not reveal hidden faults.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({state:engine.state,code:engine.code,cpuTemp:engine.temp,ramGB:engine.ramGB,score:engine.score,evidence:engine.faults.filter(f=>f.discovered).map(f=>({id:f.id,title:l(f.title),resolved:f.resolved}))})});
 register({name:'inspect_component',title:'Inspect a component',description:'Run the same diagnostic tool as the repair-bench UI. May collect evidence and award diagnosis points.',inputSchema:{type:'object',properties:{component:{type:'string',enum:Object.keys(COMPONENTS)},tool:{type:'string',enum:Object.keys(TOOLS)}},required:['component','tool'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||!COMPONENTS[input.component]||!TOOLS[input.tool]||input.component==='laptop'&&engine.rig!=='laptop')throw Error('Invalid component or tool');view.selected=input.component;view.tool=input.tool;const found=engine.diagnose(input.component,input.tool);renderAll();return{component:input.component,tool:input.tool,found:found.map(f=>({id:f.id,evidence:l(f.evidence)})),state:engine.state}}});
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script>
